[general]
static=yes
writeprotect=yes

[lab]
exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()

; The PBX, rather than the client, terminates this established call.
exten => 601,1,Answer()
 same => n,Wait(1)
 same => n,Hangup()

; Local/n preserves actual bridges for outgoing REFER/Replaces integration.
exten => 650,1,Set(TIMEOUT(absolute)=45)
 same => n,Dial(PJSIP/1000,10)
 same => n,Hangup()

exten => 651,1,Set(LAB_ROLE=original)
 same => n,Set(LAB_TONE=440)
 same => n,Goto(lab-tone,s,1)

exten => 653,1,Set(LAB_ROLE=original)
 same => n,Set(LAB_TONE=880)
 same => n,Goto(lab-tone,s,1)

exten => 602,1,Set(TIMEOUT(absolute)=45)
 same => n,Dial(Local/652@lab/n,10)
 same => n,Hangup()

exten => 652,1,Set(LAB_ROLE=target)
 same => n,Set(LAB_TONE=880)
 same => n,Goto(lab-tone,s,1)

exten => 603,1,Ringing()
 same => n,Wait(20)
 same => n,Hangup()

; A real IVR: a single 5 requires # to finish before the timeout.
exten => 605,1,Answer()
 same => n,Read(LAB_DIGITS,,2,,1,5)
 same => n,GotoIf($["${READSTATUS}"="OK" & "${LAB_DIGITS}"="5"]?accepted:failed)
 same => n(accepted),PlayTones(880)
 same => n,Wait(5)
 same => n,Hangup()
 same => n(failed),Hangup()

[lab-tone]
exten => s,1,Answer()
 same => n,Set(TIMEOUT(absolute)=45)
 same => n,Set(LAB_RX=/tmp/ruf-lab-${LAB_ROLE}-${UNIQUEID}-rx.wav)
 same => n,Set(CHANNEL(hangup_handler_push)=lab-monitor-stop,s,1)
 same => n,MixMonitor(/tmp/ruf-lab-${LAB_ROLE}-${UNIQUEID}-mix.wav,r(${LAB_RX}))
 same => n,PlayTones(${LAB_TONE})
 same => n,Wait(40)
 same => n,StopMixMonitor()
 same => n,Hangup()

[lab-monitor-stop]
exten => s,1,StopMixMonitor()
 same => n,Return()
