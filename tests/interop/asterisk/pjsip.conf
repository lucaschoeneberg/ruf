; NAT regression: the client must advertise a reachable Contact itself.
[1003]
type=endpoint
context=lab
disallow=all
allow=ulaw,alaw
auth=1003-auth
aors=1003
direct_media=no
media_address=127.0.0.1
rtp_symmetric=yes
force_rport=yes
rewrite_contact=no

[1003-auth]
type=auth
auth_type=userpass
username=1003
password=sip-lab-only-not-a-secret

[1003]
type=aor
max_contacts=4
remove_existing=no

; Exclusive generated CA/server material, loopback lab only.
[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/test-certs/server.pem
priv_key_file=/etc/asterisk/test-certs/server.key
method=tlsv1_2
verify_client=no
require_client_cert=no
local_net=127.0.0.0/8
external_media_address=127.0.0.1
external_signaling_address=127.0.0.1
external_signaling_port=5071

[1100]
type=endpoint
transport=transport-tls
context=lab
disallow=all
allow=ulaw,alaw
auth=1100-auth
aors=1100
direct_media=no
media_address=127.0.0.1
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
media_encryption=sdes
media_encryption_optimistic=no
allow_transfer=yes

[1100-auth]
type=auth
auth_type=userpass
username=1100
password=sip-lab-only-not-a-secret

[1100]
