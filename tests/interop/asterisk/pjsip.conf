; Synthetic credentials for a loopback-only lab. Never use this account in production.
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; This lab always runs on the same host as the client.
local_net=127.0.0.0/8
external_media_address=127.0.0.1
external_signaling_address=127.0.0.1
external_signaling_port=5070

[1000]
type=endpoint
context=lab
disallow=all
allow=ulaw,alaw
auth=1000-auth
aors=1000
direct_media=no
; Advertise published host ports explicitly; Docker Desktop rewrites peer IPs.
media_address=127.0.0.1
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[1000-auth]
type=auth
auth_type=userpass
username=1000
password=sip-lab-only-not-a-secret

[1000]
type=aor
max_contacts=1
remove_existing=yes

