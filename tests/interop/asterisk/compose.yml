name: sip-asterisk-lab
services:
  asterisk:
    image: andrius/asterisk:22@sha256:7ef51d47e9e670309b55cc287bbee64df75832b690e019cc7125c491c34f67b2
    entrypoint: ["/usr/sbin/asterisk"]
    command: ["-f", "-g", "-n", "-U", "asterisk"]
    ports:
      - "127.0.0.1:5070:5060/udp"
      - "127.0.0.1:30000-30010:30000-30010/udp"
    volumes:
      - ./pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./extensions.conf:/etc/asterisk/extensions.conf:ro
      - ./rtp.conf:/etc/asterisk/rtp.conf:ro
    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core show uptime"]
      interval: 2s
      timeout: 2s
      retries: 20
