name: Draft release
on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Match tag to the application version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun run check:versions
      - name: Require versioned release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: test -s "docs/releases/${RELEASE_TAG#v}.md"

  quality:
    name: Release quality
    needs: version
    uses: ./.github/workflows/quality.yml

  desktop:
    name: Verified installers
    needs: version
    uses: ./.github/workflows/desktop-build.yml

  draft:
    name: Create release draft
    needs: [version, quality, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: desktop-*
          path: artifacts
      - name: Create a draft from this run's installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mac=(artifacts/desktop-aarch64-apple-darwin/*.dmg)
          windows=(artifacts/desktop-x86_64-pc-windows-msvc/*.exe)
          mac_sbom=(artifacts/desktop-aarch64-apple-darwin/*.cdx.json)
          windows_sbom=(artifacts/desktop-x86_64-pc-windows-msvc/*.cdx.json)
          mac_evidence=(artifacts/desktop-aarch64-apple-darwin/*.build.json)
          windows_evidence=(artifacts/desktop-x86_64-pc-windows-msvc/*.build.json)
          if [[ ${#mac[@]} -ne 1 || ${#windows[@]} -ne 1 || ${#mac_sbom[@]} -ne 1 || ${#windows_sbom[@]} -ne 1 || ${#mac_evidence[@]} -ne 1 || ${#windows_evidence[@]} -ne 1 ]]; then
            echo "Expected one installer, SBOM and build-hash manifest per desktop target."
            exit 1
          fi
          sbom=("${mac_sbom[@]}" "${windows_sbom[@]}")
          evidence=("${mac_evidence[@]}" "${windows_evidence[@]}")
          for asset in "${mac[@]}" "${windows[@]}"; do
            (cd "$(dirname "$asset")" && sha256sum "$(basename "$asset")")
          done > artifacts/SHA256SUMS
          gh release create "$RELEASE_TAG" "${mac[@]}" "${windows[@]}" "${sbom[@]}" "${evidence[@]}" \
            artifacts/SHA256SUMS \
            --verify-tag --draft --prerelease --title "Ruf $RELEASE_TAG" \
            --notes-file "docs/releases/${RELEASE_TAG#v}.md"
