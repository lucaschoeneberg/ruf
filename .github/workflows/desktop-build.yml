name: Desktop build
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            bundle: dmg
            artifact: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundle: nsis
            artifact: target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
    env:
      CI: true
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install the desktop target
        run: rustup target add ${{ matrix.target }}
      - name: Build pinned native SDK
        run: bun run native:build
      - run: bun run check:versions
      - run: bun run types:generate
      - name: Verify generated contracts are current
        run: git diff --exit-code -- apps/desktop/src/lib/generated
      - run: bun run format:check
      - run: bun run test:ui
      - run: bun run check
      - run: bun run build
      - run: cargo clippy --locked --workspace --all-targets --features sip-desktop/native -- -D warnings
      - run: cargo test --locked --workspace --features sip-desktop/native
      - name: Build the installer
        run: bun run desktop:build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} --features native
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-${{ matrix.target }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14

  interop:
    name: Asterisk SIP and RTP echo
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y cmake libssl-dev pkg-config
      - run: bun run native:build
      - run: cargo test --locked -p baresip-adapter --features native
      - run: bun run test:asterisk
      - name: Lab diagnostics
        if: failure()
        run: docker compose -f tests/interop/asterisk/compose.yml logs --tail 100
      - name: Stop this test lab
        if: always()
        run: bun run lab:down
