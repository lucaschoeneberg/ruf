name: Desktop build
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            bundle: dmg
            bundles: app,dmg
            artifact: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundle: nsis
            bundles: nsis
            artifact: target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
    env:
      CI: true
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install the desktop target
        run: rustup target add ${{ matrix.target }}
      - name: Build OpenSSL for the macOS deployment target
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native/build/openssl-macos14
          curl --fail --location --retry 2 --output native/build/openssl-3.5.9.tar.gz \
            https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz
          echo '603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a  native/build/openssl-3.5.9.tar.gz' | shasum -a 256 -c -
          tar -xzf native/build/openssl-3.5.9.tar.gz -C native/build/openssl-macos14
          export OPENSSL_ROOT_DIR="$PWD/native/build/openssl-macos14/install"
          (
            cd native/build/openssl-macos14/openssl-3.5.9
            perl ./Configure darwin64-arm64-cc no-shared no-zlib \
              --prefix="$OPENSSL_ROOT_DIR" --openssldir="$OPENSSL_ROOT_DIR/ssl" \
              --libdir=lib -mmacosx-version-min=14.0
            make -j4
            make test HARNESS_JOBS=4
            make install_sw
            cp LICENSE.txt "$OPENSSL_ROOT_DIR/LICENSE.txt"
          )
          echo "OPENSSL_ROOT_DIR=$OPENSSL_ROOT_DIR" >> "$GITHUB_ENV"
      - name: Build pinned native SDK
        run: bun run native:build
      - run: bun run check:versions
      - run: bun run test:network-roam
      - name: Verify macOS service timeout recovery
        if: runner.os == 'macOS'
        run: |
          bun run test:macos-contact-timeouts
          bun run test:macos-notification-timeouts
          bun run test:macos-login-item
      - run: bun run types:generate
      - name: Verify generated contracts are current
        run: git diff --exit-code -- apps/desktop/src/lib/generated
      - run: bun run format:check
      - run: bun run test:ui
      - run: bun run check
      - run: bun run build
      - run: cargo clippy --locked --workspace --all-targets --features sip-desktop/native -- -D warnings
      - run: cargo test --locked --workspace --features sip-desktop/native
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
      - name: Retain synthetic PCM after a failed native check
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-test-recordings-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/sip-events-early-pcm.wav
            ${{ runner.temp }}/sip-events-refusal-pcm-488.wav
            ${{ runner.temp }}/sip-events-refusal-pcm-491.wav
          if-no-files-found: ignore
          retention-days: 7
      - name: Build the installer
        run: bun run desktop:build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --features native
      - name: Verify signed microphone permissions
        if: runner.os == 'macOS'
        run: bun run test:macos-audio target/${{ matrix.target }}/release/bundle/macos/Ruf.app
      - name: Verify signed contacts permissions
        if: runner.os == 'macOS'
        run: bun run test:macos-contacts target/${{ matrix.target }}/release/bundle/macos/Ruf.app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.target }}
          path: |
            ${{ matrix.artifact }}
            target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}/*.cdx.json
            target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}/*.build.json
          if-no-files-found: error
          retention-days: 14

  interop:
    name: Asterisk SIP and RTP echo
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y cmake libssl-dev pkg-config
      - run: bun run native:build
      - run: cargo test --locked -p baresip-adapter --features native
      - run: bun run test:asterisk
      - run: bun run test:network-roam
      - run: bun run test:sip-diagnostics
      - name: Lab diagnostics
        if: failure()
        run: docker compose -f tests/interop/asterisk/compose.yml logs --tail 100
      - name: Stop this test lab
        if: always()
        run: bun run lab:down
