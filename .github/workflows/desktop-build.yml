name: Desktop build
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            bundle: dmg
            bundles: app,dmg
            artifact: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            openssl-cache-path: native/build/openssl-macos14/install
            openssl-recipe: native/build-openssl-macos.sh
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundle: nsis
            bundles: nsis
            artifact: target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            openssl-cache-path: native/build/x86_64-pc-windows-msvc/vcpkg
            openssl-recipe: native/vcpkg.*
    env:
      CI: true
      # Preserve the Finder background and drag-to-Applications icon layout.
      TAURI_BUNDLER_DMG_IGNORE_CI: true
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install the desktop target
        run: rustup target add ${{ matrix.target }}
      - name: Fingerprint the native compiler toolchain
        id: native-toolchain
        run: bun native/cache-key.ts
      - name: Restore the exact native SDK
        id: native-sdk
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/install/${{ matrix.target }}
          key: native-sdk-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ steps.native-toolchain.outputs.fingerprint }}-${{ hashFiles('native/*.ts', 'native/*.sh', 'native/sources.json', 'native/vcpkg.json', 'native/patches/**', 'native/openssl-probe/**', 'scripts/check-native-sdk.ts', '.github/workflows/desktop-build.yml', '.bun-version', 'rust-toolchain.toml') }}
      - name: Validate the restored SDK and rerun its NAT regressions
        if: steps.native-sdk.outputs.cache-hit == 'true'
        run: bun scripts/check-native-sdk.ts ${{ matrix.target }}
      - name: Restore OpenSSL independently of the SIP SDK
        if: steps.native-sdk.outputs.cache-hit != 'true'
        id: openssl
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.openssl-cache-path }}
          key: openssl-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ steps.native-toolchain.outputs.fingerprint }}-${{ hashFiles(matrix.openssl-recipe) }}
      - name: Select the macOS OpenSSL prefix
        if: runner.os == 'macOS' && steps.native-sdk.outputs.cache-hit != 'true'
        shell: bash
        run: echo "OPENSSL_ROOT_DIR=$GITHUB_WORKSPACE/native/build/openssl-macos14/install" >> "$GITHUB_ENV"
      - name: Build OpenSSL for the macOS deployment target
        if: runner.os == 'macOS' && steps.native-sdk.outputs.cache-hit != 'true' && steps.openssl.outputs.cache-hit != 'true'
        shell: bash
        run: bash native/build-openssl-macos.sh
      - name: Build pinned native SDK
        if: steps.native-sdk.outputs.cache-hit != 'true'
        run: bun run native:build
      - name: Save the qualified native SDK before app checks
        if: steps.native-sdk.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: native/install/${{ matrix.target }}
          key: ${{ steps.native-sdk.outputs.cache-primary-key }}
      - name: Save qualified OpenSSL independently of the SIP SDK
        if: steps.native-sdk.outputs.cache-hit != 'true' && steps.openssl.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ matrix.openssl-cache-path }}
          key: ${{ steps.openssl.outputs.cache-primary-key }}
      - run: bun run check:versions
      - run: bun run test:network-roam
      - name: Verify macOS service timeout recovery
        if: runner.os == 'macOS'
        run: |
          bun run test:macos-contact-timeouts
          bun run test:macos-notification-timeouts
          bun run test:macos-login-item
      - run: bun run types:generate
      - name: Verify generated contracts are current
        run: git diff --exit-code -- apps/desktop/src/lib/generated
      - run: bun run format:check
      - run: bun run test:ui
      - run: bun run check
      - run: bun run build
      - run: cargo clippy --locked --workspace --all-targets --features sip-desktop/native -- -D warnings
      - run: bun run test:native
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
      - name: Retain synthetic PCM after a failed native check
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-test-recordings-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/sip-events-early-pcm.wav
            ${{ runner.temp }}/sip-events-refusal-pcm-488.wav
            ${{ runner.temp }}/sip-events-refusal-pcm-491.wav
          if-no-files-found: ignore
          retention-days: 7
      - name: Build the installer
        run: bun run desktop:build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --features native
      - name: Verify signed microphone permissions
        if: runner.os == 'macOS'
        run: bun run test:macos-audio target/${{ matrix.target }}/release/bundle/macos/Ruf.app
      - name: Verify signed contacts permissions
        if: runner.os == 'macOS'
        run: bun run test:macos-contacts target/${{ matrix.target }}/release/bundle/macos/Ruf.app
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-${{ matrix.target }}
          path: |
            ${{ matrix.artifact }}
            target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}/*.cdx.json
            target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}/*.build.json
          if-no-files-found: error
          retention-days: 14

  interop:
    name: Asterisk SIP and RTP echo
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y cmake libssl-dev pkg-config
      - run: bun run native:build
      - run: bun run test:native --adapter
      - run: bun run test:asterisk
      - run: bun run test:network-roam
      - run: bun run test:sip-diagnostics
      - name: Lab diagnostics
        if: failure()
        run: docker compose -f tests/interop/asterisk/compose.yml logs --tail 100
      - name: Stop this test lab
        if: always()
        run: bun run lab:down
