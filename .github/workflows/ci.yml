name: CI
on:
  pull_request:
  push:
    branches: [main, chore/project-foundation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/quality.yml

  desktop:
    name: Desktop
    uses: ./.github/workflows/desktop-build.yml
