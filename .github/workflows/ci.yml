name: CI
on:
  pull_request:
  push:
    branches: [main, chore/project-foundation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Portable checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - run: bun run check:versions
      - run: bun run types:generate
      - name: Verify generated contracts are current
        run: git diff --exit-code -- apps/desktop/src/lib/generated
      - run: bun run format:check
      - run: bun run test:ui
      - run: bun run check
      - run: bun run build
      - run: cargo clippy --locked -p phone-core -p baresip-adapter --all-targets -- -D warnings
      - run: cargo test --locked -p phone-core -p baresip-adapter

  desktop:
    name: Desktop
    uses: ./.github/workflows/desktop-build.yml
