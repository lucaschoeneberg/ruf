name: Set up the workspace
description: Install the pinned toolchains and locked Bun dependencies.
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: .bun-version
    - name: Install the repository's Rust toolchain
      shell: bash
      run: |
        rustup toolchain install --no-self-update
        rustup show
    - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      with:
        save-if: ${{ github.event_name != 'pull_request' }}
    - name: Install frontend dependencies
      shell: bash
      run: bun install --frozen-lockfile
