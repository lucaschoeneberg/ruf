[package]
name = "sip-desktop"
description = "SIP softphone desktop shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
native = ["baresip-adapter/native"]

[lib]
name = "sip_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
phone-core.workspace = true
baresip-adapter.workspace = true
serde.workspace = true
serde_json = "1"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = "4.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[lints]
workspace = true
