<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <title>Install Ruf</title>
  <desc>Drag Ruf on the left into the Applications folder on the right.</desc>
  <rect width="720" height="480" fill="#0d1117"/>
  <path d="M0 0H720V8H0Z" fill="#58a6ff"/>
  <g font-family="SIP UI, sans-serif">
    <text x="52" y="82" fill="#f0f6fc" font-size="36" font-weight="600" letter-spacing="-0.7">Ruf is moving in.</text>
    <text x="52" y="117" fill="#c9d1d9" font-size="17">Drag Ruf into Applications to install.</text>
    <image href="../../public/ruf.svg" x="616" y="36" width="56" height="56"/>
    <!-- Finder draws native filenames in black even over a dark image. -->
    <rect x="132" y="298" width="96" height="22" rx="2" fill="#c9d1d9"/>
    <rect x="474" y="298" width="132" height="22" rx="2" fill="#c9d1d9"/>
    <!-- The real Finder icons occupy (180, 224) and (540, 224). -->
    <g fill="none" stroke="#58a6ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M258 224H294C304 224 304 204 314 204S324 244 334 244S344 204 354 204S364 244 374 244S384 224 394 224H457"/>
      <path d="M447 214L457 224L447 234"/>
    </g>
    <path d="M52 336H668" stroke="#30363d"/>
    <text x="52" y="366" fill="#f0f6fc" font-size="18" font-weight="600">Open Ruf from Applications.</text>
    <text x="52" y="398" fill="#c9d1d9" font-size="14">Then eject this disk image.</text>
  </g>
</svg>
