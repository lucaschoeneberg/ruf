[workspace]
members = [
  "crates/phone-core",
  "crates/baresip-adapter",
  "apps/desktop/src-tauri",
]
default-members = ["crates/phone-core", "crates/baresip-adapter"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"

[workspace.dependencies]
libc = "0.2"
serde_json = "1"
phone-core = { path = "crates/phone-core" }
baresip-adapter = { path = "crates/baresip-adapter" }
serde = { version = "1", features = ["derive"] }
ts-rs = "12"
rusqlite = { version = "0.41.1", features = ["bundled"] }
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
